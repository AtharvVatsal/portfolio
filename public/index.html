<!DOCTYPE html>

    <meta name="theme-color" content="#0a0a1a" />

    <!-- Content Security Policy - relaxed for Create React App -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'unsafe-hashes' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.cloudinary.com https://images.unsplash.com; connect-src 'self' https://generativelanguage.googleapis.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com; worker-src 'self' blob:;" />
    
    <!-- Social Media -->
    <meta property="og:type" content="website" />

    <meta property="og:description" content="Computer Science Engineer, Photographer & Creative Designer" />

    <meta property="og:url" content="https://atharvvatsal.com" />

    <meta name="twitter:title" content="Atharv Vatsal" />
    <meta name="twitter:description" content="Computer Science Engineer, Photographer & Creative Designer" />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.webp" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Fonts - Non-render blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
